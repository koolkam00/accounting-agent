[project]
name = "nbaprops"
version = "0.1.0"
description = "Test whether NBA player props mean-revert, and backtest prop betting strategies on real historical sportsbook lines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nbaprops = "nbaprops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbaprops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
