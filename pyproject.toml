[project]
name = "accounting-agent"
version = "0.1.0"
description = "Deterministic accounts-payable three-way-match prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    # pypdf parses untrusted documents; keep the floor on a maintained major.
    "pypdf>=6.0",
    "reportlab>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "streamlit>=1.45",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = true
