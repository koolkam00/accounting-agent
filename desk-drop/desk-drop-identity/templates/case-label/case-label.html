<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case label template</title>
<!--
  CASE LABEL, 8.5 x 5.5 in, two per US Letter sheet. Template v1.0, 2026-10-23.
  Prints on Avery 5126-size half-sheet shipping labels, or on plain paper cut in half and taped on.
  Open in Chrome and fill the boxes, or edit the JSON block, or:
    node render/render.js case-label path/to/labels.json out.pdf
  The JSON may be a list: two labels print per sheet, in order. {"_skip": true} leaves a slot blank
  (to start on the bottom label of a half-used sheet). Field list: templates/case-label/FIELDS.md.
-->
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../system/dd-print.css">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  .labels { width: 8.5in; height: 11in; }
  .label { position: absolute; left: 0; width: 8.5in; height: 5.5in; overflow: hidden; }
  .label.slot-0 { top: 0; }
  .label.slot-1 { top: 5.5in; }
  .seam { position: absolute; left: .3in; right: .3in; top: 5.5in; border-top: 1px dashed #BBB; }
  .seam span { position: absolute; right: 0; bottom: 3px; font: 400 6.5pt/1 var(--dd-font-text); color: #999; }
  /* safe area: 0.4 in from every label edge (home printers cannot print the outer 0.25 in) */
  .in { position: absolute; left: .4in; right: .4in; top: .4in; bottom: .38in; display: grid;
        grid-template-columns: 1fr 1.9in; grid-template-rows: auto auto 1fr auto; column-gap: .3in; }
  .band { grid-column: 1 / -1; height: .1in; background: var(--dd-cobalt); }
  .to { grid-column: 1; grid-row: 2; padding-top: .12in; min-width: 0; }
  .kicker { margin: 0; font: 700 10pt/1 var(--dd-font-text); letter-spacing: .08em; text-transform: uppercase; color: var(--dd-ink-soft); }
  .office { margin: .04in 0 0; font-family: var(--dd-font-display); font-weight: 800; font-variation-settings: "opsz" 96;
            letter-spacing: -.01em; line-height: 1; white-space: nowrap; color: var(--dd-ink); }
  .addr { margin: .06in 0 0; font: 600 14pt/1.25 var(--dd-font-text); }
  .handto { margin: .04in 0 0; font: 400 13pt/1.25 var(--dd-font-text); }
  .count { grid-column: 2; grid-row: 2 / 4; align-self: start; margin-top: .12in; border: 3px solid var(--dd-ink); text-align: center; padding: .1in .05in .12in; }
  .count .n { display: block; font: 800 64pt/1 var(--dd-font-display); font-variation-settings: "opsz" 96; letter-spacing: -.02em; }
  .count .u { display: block; font: 700 14pt/1.1 var(--dd-font-text); margin-top: .02in; }
  .count .c { display: block; font: 600 12pt/1.1 var(--dd-font-text); margin-top: .08in; padding-top: .07in; border-top: 1.5px solid var(--dd-ink); }
  .what { grid-column: 1; grid-row: 3; align-self: start; margin-top: .16in; padding-top: .1in; border-top: 2px solid var(--dd-ink); min-width: 0; }
  .brand { margin: 0; font: 800 24pt/1.05 var(--dd-font-display); font-variation-settings: "opsz" 96; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .product { margin: .03in 0 0; font: 400 13pt/1.25 var(--dd-font-text); }
  .ids { margin: .08in 0 0; font: 600 11pt/1.3 var(--dd-font-text); }
  .foot { grid-column: 1 / -1; grid-row: 4; display: flex; justify-content: space-between; align-items: flex-end; gap: .2in; padding-top: .08in; border-top: 1px solid var(--dd-ink); }
  .care { margin: 0; font: 400 10.5pt/1.3 var(--dd-font-text); max-width: 4.3in; }
  .phone { text-align: right; white-space: nowrap; }
  .phone b { display: block; font: 700 15pt/1.1 var(--dd-font-text); }
  .phone img { display: block; margin: .05in 0 0 auto; }
  .reserve .office { color: var(--dd-ink); }
  .reserve .band { background: var(--dd-ink); }
  .label .dd-sample-banner { position: absolute; left: .4in; right: .4in; top: .17in; height: .2in; }
  .ids span { white-space: nowrap; }
  .empty { display: flex; align-items: center; justify-content: center; font: 400 9pt var(--dd-font-text); color: #BBB; }
  @media print { .empty { color: transparent; } }
</style>
</head>
<body>
<div id="dd-sheets"></div>

<!-- ============ EDIT THE LABEL HERE (or use the boxes on screen) ============
     One object = one label. A list [ {...}, {...} ] prints two per sheet.
     label_type: "office" (default) or "reserve" (your reserve bag; office fields ignored). -->
<script type="application/json" id="dd-data">
[
  {
    "label_type": "office",
    "office_name": "[OFFICE NAME]",
    "office_address": "[OFFICE ADDRESS]",
    "floor_suite": "[FLOOR OR SUITE]",
    "deliver_to": "[PANTRY OWNER]",
    "brand_name": "[BRAND]",
    "product_name": "[PRODUCT AND PACK SIZE]",
    "units_in_case": "[N]",
    "case_number": "[CASE NO]",
    "case_total": "[TOTAL]",
    "drop_date": "[DROP DATE]",
    "office_id": "[OFFICE ID]",
    "campaign_id": "[CAMPAIGN ID]",
    "drop_id": "[DROP ID]",
    "phone": ""
  },
  {
    "label_type": "reserve",
    "brand_name": "[BRAND]",
    "product_name": "[PRODUCT AND PACK SIZE]",
    "units_in_case": "[N]",
    "case_number": "",
    "case_total": "",
    "drop_date": "[DROP DATE]",
    "campaign_id": "[CAMPAIGN ID]",
    "drop_id": "[DROP ID]",
    "phone": ""
  }
]
</script>
<!-- ========================================================================= -->

<script src="../../system/vendor/qrcode-generator-2.0.4.js"></script>
<script src="../../system/brand.js"></script>
<script src="../../system/dd-template.js"></script>
<script>
(function () {
  'use strict';
  const B = DD.brand();
  const IN = 96;
  const OFFICE_MAX = 48 / 72 * IN, OFFICE_MIN = 26 / 72 * IN; // 48 pt down to 26 pt

  const FIELDS = [
    { group: 'Type', key: 'label_type', label: 'Label type: office or reserve', options: [['office', 'office: a case for one office'], ['reserve', 'reserve: your own reserve bag']], help: '"reserve" prints a label for your own reserve bag; the office boxes are then ignored.' },
    { group: 'Office', key: 'office_name', label: 'Office (company) name', help: 'From signed_offices.csv: company.' },
    { group: 'Office', key: 'office_address', label: 'Street address', help: 'From office_address.' },
    { group: 'Office', key: 'floor_suite', label: 'Floor or suite', help: 'From floor_suite.' },
    { group: 'Office', key: 'deliver_to', label: 'Hand to (pantry owner)', help: 'From pantry_owner_name. Business contact only.' },
    { group: 'Product', key: 'brand_name', label: 'Brand', required: true, help: 'From paid_brands.csv: brand_name.' },
    { group: 'Product', key: 'product_name', label: 'Product and pack size', help: 'From product_sku, e.g. "Sea Salt Lentil Crisps, 1 oz bags".' },
    { group: 'Product', key: 'units_in_case', label: 'Units in this case', required: true, help: 'Count them as you pack. Whole number.' },
    { group: 'Product', key: 'case_number', label: 'Case number', help: 'This case, e.g. 1.' },
    { group: 'Product', key: 'case_total', label: 'Cases for this office', help: 'Total cases going to this office, e.g. 2.' },
    { group: 'Drop', key: 'drop_date', label: 'Drop date', required: true, help: 'YYYY-MM-DD, Tuesday or Wednesday.' },
    { group: 'Drop', key: 'office_id', label: 'Office ID', help: 'e.g. O-003.' },
    { group: 'Drop', key: 'campaign_id', label: 'Campaign ID', help: 'e.g. CMP-001.' },
    { group: 'Drop', key: 'drop_id', label: 'Drop ID', help: 'e.g. DRP-001.' },
    { group: 'Drop', key: 'phone', label: 'Phone (leave empty to use brand.json)', help: 'Defaults to the PHONE in brand.json.' }
  ];

  function labelHTML(r, i) {
    if (!r || r._skip) return `<div class="empty">blank label slot</div>`;
    const reserve = (r.label_type || 'office').toLowerCase() === 'reserve';
    const phone = (r.phone || '').trim() || (B.contact && B.contact.PHONE) || '[PHONE]';
    const caseLine = (r.case_number && r.case_total) ? `Case ${DD.text(r.case_number)} of ${DD.text(r.case_total)}` : '';
    const ids = [r.office_id && !reserve ? `Office ${DD.text(r.office_id)}` : '', r.campaign_id ? DD.text(r.campaign_id) : '', r.drop_id ? DD.text(r.drop_id) : ''].filter(Boolean).map(x => `<span>${x}</span>`).join(' · ');
    const care = reserve
      ? 'Sealed, shelf-stable food. Keep at room temperature, clean, dry and off the floor. Nothing opened or repacked.'
      : 'Sealed, shelf-stable food. Keep at room temperature. Please hand to the person named above; do not leave it unattended in the lobby.';
    const to = reserve
      ? `<p class="kicker">Not for an office</p><h1 class="office">RESERVE</h1>
         <p class="addr">Keep with the founder. Top-ups on day 3 come from here.</p>`
      : `<p class="kicker">Deliver to</p><h1 class="office">${DD.text(r.office_name || '[OFFICE NAME]')}</h1>
         <p class="addr">${DD.text(r.office_address || '[OFFICE ADDRESS]')}${r.floor_suite ? ', ' + DD.text(r.floor_suite) : ''}</p>
         ${r.deliver_to ? `<p class="handto">Hand to <b>${DD.text(r.deliver_to)}</b></p>` : ''}`;
    return `
      <div class="dd-sample-banner">Sample. Illustrative placeholders, not results.</div>
      <div class="in">
        <div class="band"></div>
        <div class="to">${to}</div>
        <div class="count"><span class="n">${DD.text(r.units_in_case || '[N]')}</span><span class="u">units in this case</span>${caseLine ? `<span class="c">${caseLine}</span>` : ''}</div>
        <div class="what">
          <p class="brand">${DD.text(r.brand_name || '[BRAND]')}</p>
          ${r.product_name ? `<p class="product">${DD.text(r.product_name)}</p>` : ''}
          <p class="ids"><span>Drop ${DD.text(r.drop_date || '[DROP DATE]')}</span>${ids ? ' · ' + ids : ''}</p>
        </div>
        <div class="foot">
          <p class="care">${care}</p>
          <div class="phone"><b>Questions: ${DD.text(phone)}</b>${DD.wordmarkImg(0.15)}</div>
        </div>
      </div>`;
  }

  function render(sheet, recs, start) {
    sheet.classList.add('labels');
    sheet.style.width = '8.5in'; sheet.style.height = '11in';
    let html = '';
    for (let k = 0; k < 2; k++) {
      const r = recs[k];
      const reserve = r && !r._skip && (r.label_type || 'office').toLowerCase() === 'reserve';
      html += `<div class="label slot-${k}${reserve ? ' reserve' : ''}">${labelHTML(r, start + k)}</div>`;
      if (r && !r._skip) {
        const i = start + k;
        const ph = (r.phone || '').trim() || (B.contact && B.contact.PHONE) || '[PHONE]';
        if (DD.isPlaceholder(ph)) DD.placeholder(i, 'phone (fill PHONE in brand.json)');
        if (!reserve && !r.office_name) DD.error(i, 'Office name is empty (use label_type "reserve" for your reserve bag).');
        if (r.units_in_case && !/^\d+$/.test(String(r.units_in_case).trim()) && !DD.isPlaceholder(String(r.units_in_case))) DD.error(i, 'Units in this case must be a whole number.');
        if (r.drop_date && /^\d{4}-\d{2}-\d{2}$/.test(r.drop_date)) {
          const d = new Date(r.drop_date + 'T12:00:00');
          if (![2, 3].includes(d.getDay())) DD.warn(i, `Drop date ${r.drop_date} is not a Tuesday or Wednesday.`);
        }
      }
    }
    html += '<div class="seam"><span>Plain paper: cut here</span></div>';
    sheet.innerHTML = html;
  }

  function fit(sheet, recs, start) {
    sheet.querySelectorAll('.label').forEach((lab, k) => {
      const office = lab.querySelector('.office');
      if (!office) return;
      const box = lab.querySelector('.to');
      office.style.fontSize = '100px';
      let px = Math.min(OFFICE_MAX, Math.floor(100 * box.clientWidth / office.scrollWidth));
      office.style.fontStretch = '100%';
      if (px < OFFICE_MAX * .75) { office.style.fontStretch = '87.5%'; office.style.fontSize = '100px'; px = Math.min(OFFICE_MAX, Math.floor(100 * box.clientWidth / office.scrollWidth)); }
      if (px < OFFICE_MIN) { DD.warn(start + k, 'Office name is long; it was set at the smallest size. Use the short name people say.'); px = OFFICE_MIN; office.style.whiteSpace = 'normal'; }
      office.style.fontSize = px + 'px';
      const brand = lab.querySelector('.brand');
      if (brand && brand.scrollWidth > brand.clientWidth + 1) DD.warn(start + k, 'Brand name was cut short on the label. Use the short brand name.');
    });
  }

  DD.init({
    title: 'case label',
    fields: FIELDS,
    recordLabel: 'Label',
    recordName: (r, k) => `Label ${k + 1} (${(r.label_type || 'office') === 'reserve' ? 'reserve' : (r.office_name && !DD.isPlaceholder(String(r.office_name)) ? r.office_name : 'office')})`,
    panelIntro: 'Two labels print per sheet. Choose a label in the box below to edit it, press <b>Add a label</b> for the next case, or <b>Remove</b> one you do not need. The page updates as you type. When it looks right, press <b>Print</b>.',
    render, fit, perSheet: 2,
    fileStem: (r) => 'case-labels_' + (r.drop_id || 'drop'),
    printHelp: '<b>Chrome print settings:</b> Paper Letter. Scale 100 (or "Actual size"). Margins Default. Turn on "Background graphics". Two labels per sheet: Avery 5126-size half-sheet labels, or plain paper cut on the dashed line.'
  });
})();
</script>
</body>
</html>
