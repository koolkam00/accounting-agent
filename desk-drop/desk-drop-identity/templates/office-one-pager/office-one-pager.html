<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office one-pager template</title>
<!--
  OFFICE ONE-PAGER, US Letter portrait. Template v1.1, 2026-10-24.
  Sent the same day as a discovery call that ended in "can I send you a one-pager?", with a
  specific proposed first-drop week (plan.md Phase 1, conversion path step 2).
  Contents, from plan.md: the pitch to offices; "What offices get and give"; what is not asked of
  offices; "How a campaign runs" from the office's side; the product standard; privacy;
  "The founding-office offer"; "What they sign".
  Every sentence is a box in the panel, so you can change words without touching code.
  {BRAND_NAME} in a box prints the name from brand.json. **Two stars** make words bold.
  Open in Chrome, or: node render/render.js office-one-pager data.json out.pdf --final
-->
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../system/dd-print.css">
<link rel="stylesheet" href="../../system/dd-docs.css">
<style>
  .op .bd { padding-top: .2in; }
  .op h1.title { font-size: 25pt; max-width: 6.6in; }
  .op .lead { font-size: 11pt; max-width: 6.6in; }
  .op .h2b { margin-top: .12in; }
  .op .found .sign { margin-top: .07in; padding-top: .06in; border-top: 1px solid var(--dd-mist); }
  .op .when { margin-top: .14in; display: flex; gap: .12in; align-items: baseline; }
  .op .when b { flex: none; font: 700 8pt/1.2 var(--dd-font-text); letter-spacing: .08em; text-transform: uppercase; }
  .op .when span { font-size: 10pt; }
  .op .g6 { margin-top: .16in; row-gap: .17in; }
  .op .vis { display: flex; flex-direction: column; gap: .08in; }
  .op .vis .photo { width: 100%; height: 2.1in; }
  .op .vis figcaption, .op figcaption { font-size: 8.5pt; line-height: 1.35; margin-top: .06in; }
  .op ol.steps li { margin-bottom: .05in; }
  .op .found { border: 2px solid var(--dd-ink); padding: .1in .12in; }
  .op .next { border-top: 2px solid var(--dd-ink); padding-top: .08in; display: flex; justify-content: space-between; gap: .3in; align-items: flex-start; }
  .op .next p { font-size: 10pt; }
  .op .next .who { text-align: right; white-space: nowrap; font-size: 10pt; }
  .op.tight p, .op.tight li { font-size: 9pt; line-height: 1.35; }
  .op.s-gap .g6 { row-gap: .12in; margin-top: .12in; }
  .op.s-gap .when { margin-top: .1in; }
</style>
</head>
<body>
<div id="dd-sheets"></div>

<!-- ============ EDIT THE ONE-PAGER HERE (or use the boxes on screen) ============ -->
<script type="application/json" id="dd-data">
{
  "prepared_for": "",
  "first_drop": "[FIRST DROP WEEK: week of Mon 2027-01-11]",
  "visual": "card",
  "photo": "[PHOTO]",
  "photo_caption": "The display card on a real pantry shelf.",
  "headline": "Vetted emerging snacks and drinks, free, roughly monthly.",
  "lead": "You pick the categories and can veto anything. All we ask: on the shelf the day it arrives, one photo, and three questions for your team.",
  "gets": "One to three vetted emerging brands per drop, free, roughly monthly as supply allows.\nOnly the categories you choose, and a veto on any brand.\nOne contact. Deliveries on Tuesday or Wednesday mornings, in your receiving window.\nA display card, so your team knows what it is and what is in it.\nYour team's feedback, summarized for you after each drop.",
  "gives": "A named pantry owner and a receiving window.\nOn the shelf within one business day of delivery.\nTwo photos: the pantry the day you place it, the card and product on day 3 or 5.\nOne Slack or email post of the survey link; five or more responses.\nA ten-minute debrief, and your Tuesday headcount.",
  "never": "Never asked of you: payment, employees' contact details, exclusivity, or storing anything beyond the drop.",
  "steps": "A short intake form: categories, vetoes, Tuesday headcount, receiving window.\nWe propose a brand. You approve it by reply, or veto it.\nA Tuesday or Wednesday morning: one labeled case and a display card arrive.\nFive business days later the survey closes, and you get your team's feedback.",
  "product": "Sealed, individually packaged, shelf-stable, labeled with ingredients and allergens.\nNever alcohol, cannabis or CBD, supplements, anything refrigerated or needing preparation, or health claims.",
  "privacy": "No personal data about your employees. The survey is anonymous: no login, no email. An optional newsletter box, unticked, sends an email to the brand only if someone ticks it.",
  "founding": "Your first drop in the week named above, with a brand you approved.\nNamed on the founding roster only if you say yes.\nVeto and category profile, changeable any time.\nLeave any time with a week's notice.",
  "sign": "**What you sign:** a one-page participation agreement listing what each side commits to. No fees either way.",
  "next": "**Next step:** reply with a yes and I will send the intake form, or pick 15 minutes for a call.",
  "card_caption": "What your team sees: the brand, who makes it, a QR code for three questions, the allergen statement word for word from the package, and where to buy it nearby."
}
</script>
<!-- ========================================================================= -->

<script src="../../system/brand.js"></script>
<script src="../../system/dd-template.js"></script>
<script src="../../system/dd-docs.js"></script>
<script>
(function () {
  'use strict';
  const X = DDDocs;
  const C = 'Copy (change only if you need to)';
  const FIELDS = [
    { group: 'This office', key: 'prepared_for', label: 'Office name (optional)', help: 'Prints "Prepared for ..." in the header. Leave empty for a general copy.' },
    { group: 'This office', key: 'first_drop', label: 'Proposed first drop', required: true, help: 'A specific week, e.g. "week of Mon 2027-01-11". Tuesday or Wednesday drops only, no blackout weeks (CONTRACTS section 3).' },
    { group: 'Picture', key: 'visual', label: 'Picture on the page', options: [['card', 'A drawing of the display card (no photo needed)'], ['photo', 'A real photo of the card on a shelf']] },
    { group: 'Picture', key: 'photo', type: 'image', label: 'Photo (if you chose a real photo)', help: 'Your own photo of the card on a real pantry shelf. No identifiable people. Never a stock photo.' },
    { group: 'Picture', key: 'photo_caption', label: 'Photo caption' },
    { group: C, key: 'headline', label: 'Headline', multiline: true, rows: 2, maxChars: 70 },
    { group: C, key: 'lead', label: 'Lead (under the headline)', multiline: true, rows: 3, maxChars: 170 },
    { group: C, key: 'gets', label: 'What you get (one per line)', multiline: true, rows: 6 },
    { group: C, key: 'gives', label: 'What we ask (one per line)', multiline: true, rows: 6 },
    { group: C, key: 'never', label: 'What we never ask', multiline: true, rows: 2 },
    { group: C, key: 'steps', label: 'How a drop works (four steps, one per line)', multiline: true, rows: 6 },
    { group: C, key: 'card_caption', label: 'Caption under the card drawing', multiline: true, rows: 3 },
    { group: C, key: 'product', label: 'What is in the case (one per line)', multiline: true, rows: 4 },
    { group: C, key: 'privacy', label: 'Your team\'s privacy', multiline: true, rows: 4 },
    { group: C, key: 'founding', label: 'Founding offices (one per line)', multiline: true, rows: 6 },
    { group: C, key: 'sign', label: 'What you sign', multiline: true, rows: 2 },
    { group: C, key: 'next', label: 'Next step', multiline: true, rows: 2 }
  ];
  const list = (t, cls) => `<ul class="${cls || 'ticks'}">${X.items(t).map((x) => `<li>${X.t(x)}</li>`).join('')}</ul>`;

  function render(sheet, r, i) {
    sheet.classList.add('doc');
    const photo = r.visual === 'photo';
    const vis = photo
      ? `<figure class="vis">${X.imgSlot(r.photo, '', 'photo')}<figcaption>${X.t(r.photo_caption || '')}</figcaption></figure>`
      : `<figure class="vis">${X.cardDiagram({ widthIn: 2.9, pins: false })}<figcaption>${X.t(r.card_caption)}</figcaption></figure>`;
    if (photo && !DD.imgSrc(r.photo)) DD.placeholder(i, 'photo');
    ['headline', 'lead', 'gets', 'gives', 'steps', 'product', 'founding', 'next'].forEach((k) => X.checkClaims(i, `"${FIELDS.find((f) => f.key === k).label}"`, r[k]));
    sheet.innerHTML = `<div class="page op">
      <div class="dd-sample-banner">Sample. Illustrative placeholders, not results.</div>
      ${X.header({ kicker: 'For office and workplace managers', meta: r.prepared_for ? `Prepared for ${DD.text(r.prepared_for)}` : 'Founding offices · Flatiron, NoMad and Union Square' })}
      <div class="bd">
        <h1 class="title">${X.t(r.headline)}</h1>
        <p class="lead">${X.t(r.lead)}</p>
        <div class="when tint"><b>Proposed first drop</b><span>${X.t(r.first_drop)}, on a Tuesday or Wednesday morning.</span></div>
        <div class="g6">
          <section class="sec s3"><h2>What you get</h2>${list(r.gets)}</section>
          <section class="sec s3"><h2>What we ask</h2>${list(r.gives)}<p class="note" style="margin-top:.05in">${X.t(r.never)}</p></section>
          <section class="sec s3"><h2>How a drop works</h2><ol class="steps">${X.items(r.steps).map((x) => `<li>${X.t(x)}</li>`).join('')}</ol></section>
          <section class="sec s3">${vis}</section>
          <section class="sec s3"><h2>What is in the case</h2>${list(r.product, 'plain')}<h2 class="h2b">Your team's privacy</h2><p>${X.t(r.privacy)}</p></section>
          <section class="sec s3 found"><h2>Founding offices</h2>${list(r.founding, 'ticks')}<p class="sign">${X.t(r.sign)}</p></section>
          <section class="sec s6 next"><div><p>${X.t(r.next)}</p></div><div class="who">${X.contact(' · ', ['FOUNDER_NAME', 'PHONE', 'EMAIL'])}</div></section>
        </div>
      </div>
      ${X.footer(`${X.brandName()} · ${DD.text(DD.contact('POSTAL_ADDRESS'))}`, DD.escape(DD.brand().TAGLINE || ''))}
    </div>`;
  }
  const D = (s) => DD.text(s);

  function fit(sheet, r, i) {
    const pg = sheet.querySelector('.page');
    let tight = false, cardIn = 2.9;
    const steps = [
      () => { if (!tight) { tight = true; pg.classList.add('tight'); return true; } },
      () => { const c = pg.querySelector('.card-dg'); if (c && cardIn > 2.4) { cardIn -= 0.1; c.style.width = cardIn + 'in'; c.style.fontSize = (cardIn * 0.115) + 'in'; return true; } },
      () => { const p = pg.querySelector('.vis .photo'); if (p && parseFloat(p.style.height || '2.1') > 1.5) { p.style.height = (parseFloat(p.style.height || '2.1') - 0.1) + 'in'; return true; } },
      () => { if (!pg.classList.contains('s-gap')) { pg.classList.add('s-gap'); return true; } },
    ];
    X.fitPages(sheet, i, steps, 'The one-pager');
    sheet.dataset.fit = JSON.stringify({ tight, card_in: Math.round(cardIn * 100) / 100, tighter_gaps: pg.classList.contains('s-gap') });
  }

  DD.init({
    title: 'office one-pager', fields: FIELDS, render, fit, sheetClass: 'doc',
    fileStem: (r) => 'office-one-pager_' + (r.prepared_for || 'general'),
    printLabel: 'Print or save as PDF',
    printHelp: '<b>To make the PDF:</b> press the button, choose Destination "Save as PDF", Paper Letter, Scale 100, Margins Default, "Background graphics" on.'
  });
})();
</script>
</body>
</html>
