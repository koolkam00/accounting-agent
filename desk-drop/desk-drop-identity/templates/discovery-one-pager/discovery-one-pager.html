<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery one-pager template</title>
<!--
  DISCOVERY ONE-PAGER, US Letter portrait. Template v1.1, 2026-10-24.
  plan.md Phase 0: "A one-page PDF describing the idea in five sentences is enough for discovery."
  Weeks 1 to 3, sent before or after a research conversation with an office or a brand. No selling:
  no price, no offer, no call to buy. The template checks there are exactly five sentences and
  warns on selling words. {BRAND_NAME} prints the name from brand.json.
  Open in Chrome, or: node render/render.js discovery-one-pager data.json out.pdf --final
-->
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../system/dd-print.css">
<link rel="stylesheet" href="../../system/dd-docs.css">
<style>
  .dc .bd { padding-top: .9in; padding-left: .55in; padding-right: .7in; }
  .dc h1.title { font-size: 25pt; line-height: 1.08; max-width: 5.6in; }
  .dc .five { margin-top: .4in; counter-reset: s; }
  .dc .five p { font: 400 14pt/1.5 var(--dd-font-text); margin: 0 0 .2in; max-width: 5.8in; color: var(--dd-ink); }
  .dc .who { margin-top: .35in; padding-top: .14in; border-top: 2px solid var(--dd-ink); max-width: 5.8in; }
  .dc .who p { font-size: 11pt; line-height: 1.5; }
  .dc .who b { font-size: 12pt; }
</style>
</head>
<body>
<div id="dd-sheets"></div>

<!-- ============ EDIT THE ONE-PAGER HERE (or use the boxes on screen) ============
     Five sentences, one per box. Describe the idea; do not sell it. -->
<script type="application/json" id="dd-data">
{
  "meta": "Research stage",
  "title": "An idea I'm testing in Flatiron, NoMad and Union Square",
  "s1": "{BRAND_NAME} is an idea I'm testing: bring sealed snacks and drinks from emerging brands to a handful of offices around Flatiron, NoMad and Union Square, about once a month.",
  "s2": "The office would get them free, choose the categories and veto anything, and in return put them on the shelf the day they arrive, send a photo and share a three-question survey with the team.",
  "s3": "The brand would pay a fixed fee per office and get a one-page report that keeps every count separate: units delivered, placed and depleted, survey responses, QR scans and code redemptions.",
  "s4": "No personal data about employees would be collected, and the survey would be anonymous.",
  "s5": "Nothing is for sale yet; I'd value 20 minutes to hear how your pantry or your sampling works today, and whether this would help or get in the way."
}
</script>
<!-- ========================================================================= -->

<script src="../../system/brand.js"></script>
<script src="../../system/dd-template.js"></script>
<script src="../../system/dd-docs.js"></script>
<script>
(function () {
  'use strict';
  const X = DDDocs;
  const FIELDS = [
    { group: 'Header', key: 'meta', label: 'Small line in the header', help: 'Default "Research stage".' },
    { group: 'Header', key: 'title', label: 'Title (a phrase, not a sentence)', maxChars: 70 },
    { group: 'The idea in five sentences (one per box)', key: 's1', label: 'Sentence 1: what it is', required: true, multiline: true, rows: 3 },
    { group: 'The idea in five sentences (one per box)', key: 's2', label: 'Sentence 2: what an office gets and gives', required: true, multiline: true, rows: 3 },
    { group: 'The idea in five sentences (one per box)', key: 's3', label: 'Sentence 3: what a brand gets', required: true, multiline: true, rows: 3 },
    { group: 'The idea in five sentences (one per box)', key: 's4', label: 'Sentence 4: privacy', required: true, multiline: true, rows: 2 },
    { group: 'The idea in five sentences (one per box)', key: 's5', label: 'Sentence 5: why you are writing', required: true, multiline: true, rows: 3 }
  ];
  // Selling words: a discovery page describes the idea and asks to listen. It never offers.
  const SELLING = /(\$\s?\d|\bprice[sd]?\b|\bdiscount\b|\boffer\b|\bdeal\b|\blimited\b|\bexclusive\b|\bsign up\b|\bspots? left\b|\bbook (a|your)\b|\bact now\b|\bspecial\b|\bfounding\b|\bguarantee)/i;
  const KEYS = ['s1', 's2', 's3', 's4', 's5'];
  // One sentence = ends with . ! or ?, and has no sentence end inside it.
  function sentences(t) {
    const s = String(t || '').trim();
    if (!s) return 0;
    const inner = (s.slice(0, -1).match(/[.!?](?=\s+["'“(]?[A-Z0-9])/g) || []).length;
    return inner + (/[.!?]["'”)]?$/.test(s) ? 1 : 0);
  }

  function render(sheet, r, i) {
    sheet.classList.add('doc');
    let total = 0;
    KEYS.forEach((k, j) => {
      const n = sentences(r[k]); total += n;
      if (String(r[k] || '').trim() && n !== 1) DD.error(i, `Sentence ${j + 1} reads as ${n} sentences. One sentence per box: the page explains the idea in exactly five.`);
      if (SELLING.test(r[k] || '')) DD.warn(i, `Sentence ${j + 1} sounds like selling ("${(r[k].match(SELLING) || [''])[0]}"). The discovery page describes the idea and asks to listen; it does not offer anything.`);
      X.checkClaims(i, `Sentence ${j + 1}`, r[k]);
    });
    if (/[.!?]\s*$/.test(String(r.title || ''))) DD.warn(i, 'The title ends like a sentence. Keep it a phrase, so the page has exactly five sentences.');
    sheet.dataset.sentences = String(total);
    sheet.innerHTML = `<div class="page dc">
      <div class="dd-sample-banner">Sample. Illustrative placeholders, not results.</div>
      ${X.header({ cap: 0.3, kicker: 'A research conversation, not a pitch', meta: X.t(r.meta) })}
      <div class="bd">
        <h1 class="title">${X.t(r.title)}</h1>
        <div class="five">${KEYS.map((k) => `<p>${X.t(r[k])}</p>`).join('')}</div>
        <div class="who"><p><b>${DD.text(DD.contact('FOUNDER_NAME'))}</b><br>${X.contact(' · ', ['PHONE', 'EMAIL'])}</p></div>
      </div>
      ${X.footer(`${X.brandName()} (working name) · ${DD.text(DD.contact('POSTAL_ADDRESS'))}`, '')}
    </div>`;
  }
  function fit(sheet, r, i) {
    const pg = sheet.querySelector('.page');
    let pt = 14;
    const steps = [() => { if (pt > 12) { pt -= 0.5; pg.querySelectorAll('.five p').forEach((p) => { p.style.fontSize = pt + 'pt'; }); return true; } }];
    X.fitPages(sheet, i, steps, 'The five sentences');
    sheet.dataset.fit = JSON.stringify({ sentence_pt: pt, sentences: +sheet.dataset.sentences });
  }

  DD.init({
    title: 'discovery one-pager', fields: FIELDS, render, fit, sheetClass: 'doc',
    fileStem: () => 'discovery-one-pager',
    printLabel: 'Print or save as PDF',
    printHelp: '<b>To make the PDF:</b> press the button, choose Destination "Save as PDF", Paper Letter, Scale 100, Margins Default, "Background graphics" on.'
  });
})();
</script>
</body>
</html>
