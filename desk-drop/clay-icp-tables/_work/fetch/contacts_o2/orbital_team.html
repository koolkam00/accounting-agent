<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    // Update current year
    $('[data-current-year]').text(new Date().getFullYear());

    // Register the ScrollSmoother plugin
    gsap.registerPlugin(ScrollSmoother);

    // Create the scroll smoother
    let smoother = ScrollSmoother.create({
      wrapper: '#smooth-wrapper',
      content: '#smooth-content',
      smooth: 1.2,
      effects: true,
      smoothTouch: 0.1,
      //normalizeScroll: true, // add this — standardizes scroll delta across browsers, reduces subpixel jitter
     //ignoreMobileResize: true, // optional — prevents recalculation jank on mobile URL bar show/hide
    });
    // For section scroll — reuse the same smoother instance, don't redeclare it
    if (window.location.hash && smoother) {
      window.scrollTo(0, 0);

      const target = document.querySelector(window.location.hash);

      if (target) {
        window.addEventListener('load', function () {
          requestAnimationFrame(() => {
            smoother.refresh();
            smoother.scrollTo(target, true, 'top top');
          });
        });
      }
    }
  });
</script>

<script>
// Sends HubSpot context (tracking cookie, page URL, page title) with Webflow forms via Make.
// Requires the HubSpot tracking code and hidden inputs named hutk, page_uri, page_name in the form.
// hutk is empty if the visitor declined HubSpot cookies.
document.addEventListener('submit', function (e) {
  const form = e.target;
  const m = document.cookie.match(/(?:^|;\s*)hubspotutk=([^;]+)/); // HubSpot visitor token
  const set = (name, val) => {
    const el = form.querySelector(`input[name="${name}"]`);
    if (el) el.value = val;
  };
  set('hutk', m ? m[1] : '');
  set('page_uri', location.href);
  set('page_name', document.title);
}, true); // capture phase: runs before Webflow submits the form
</script>
