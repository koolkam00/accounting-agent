    key_phrases: ["filed a voluntary petition for relief under Chapter 7", "claim of $52,000.00"]
    fields:
      issuer: brandt_loewy
      date: "October 14, 2025"
      delivery: VIA U.S. MAIL AND EMAIL
      to: [Attn: Accounts Receivable, "Meridian Mechanical Services, LLC", 1150 Commerce Park Drive, "Brandon, FL 33511"]
      re: ["Halvorsen Builders, Inc. - Chapter 7 Bankruptcy", "Case No. 8:25-bk-06214, U.S. Bankruptcy Court, Middle District of Florida"]
      salutation: "To Whom It May Concern:"
      body:
        - "Please be advised that on October 6, 2025, Halvorsen Builders, Inc. (the \"Debtor\") filed a voluntary petition for relief under Chapter 7 of the United States Bankruptcy Code. Your company is listed in the Debtor's schedules as an unsecured creditor with a claim of $52,000.00."
        - "The automatic stay under 11 U.S.C. § 362 is now in effect. You must immediately cease all collection activity against the Debtor, including calls, letters, liens and lawsuits."
        - "The Chapter 7 trustee has preliminarily indicated that this appears to be a no-asset case. If assets are later recovered, creditors will receive notice and a deadline to file proofs of claim."
      closing: Sincerely,
      signatures:
        - {party: "BRANDT & LOEWY, P.A.", name: "Hannah Loewy, Esq.", title: Counsel for the Debtor, signed: true}
