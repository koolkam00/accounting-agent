  - id: dawson_settlement
    filename: 4.2.6 Dawson Settlement Agreement.pdf
    folder: 04 Legal
    template: agreement
    key_phrases:
      - "shall be paid by the Company's employment practices liability insurer"
      - "The Company shall have no obligation to fund any portion of the Settlement Payment."
    fields:
      title: CONFIDENTIAL SETTLEMENT AGREEMENT AND MUTUAL RELEASE
      subtitle: ["Dawson v. Meridian Mechanical Services, LLC", Hillsborough County Circuit Court Case No. 24-CA-008815]
      preamble: "This Confidential Settlement Agreement and Mutual Release (the \"Agreement\") is entered into as of November 14, 2025 (the \"Effective Date\") by and between Carla Dawson (\"Plaintiff\") and Meridian Mechanical Services, LLC (the \"Company\")."
      recitals:
        - "Plaintiff filed the above-captioned action alleging wrongful termination and retaliation (the \"Action\")."
        - "The Company denies all liability. The parties wish to resolve the Action fully and finally to avoid the expense and uncertainty of further litigation."
      recitals_close: "NOW, THEREFORE, in consideration of the mutual promises below, the parties agree as follows:"
      sections:
        - heading: Settlement Payment.
          body:
            - "In full settlement of the Action, Plaintiff shall receive the gross sum of $185,000.00 (the \"Settlement Payment\"). The Settlement Payment shall be paid by the Company's employment practices liability insurer, Coastal Risk Insurance, on the Company's behalf within thirty (30) days after the Effective Date. The Company shall have no obligation to fund any portion of the Settlement Payment."
        - heading: Dismissal.
          body: ["Within five (5) business days after receipt of the Settlement Payment, Plaintiff shall file a stipulation of dismissal of the Action with prejudice."]
