# ---------------------------------------------------------------------------
# Answer key (SPEC §10 and the binding §10.1 review amendments). Keys and globs
# resolve to GL source rows. Non-REQUEST_INFO amounts are verified: supporting
# rows + recoveries - period moves must equal them.
# ---------------------------------------------------------------------------
ground_truth:
  authored_by: QoE Evidence Review build team; answer key per docs/qoe/SPEC.md §10 and §10.1 panel review
  notes: >-
    SYNTHETIC. supporting_gl_rows are the GL rows behind the diligence amount; for REQUEST_INFO items they are
    the GL cost base management's claim is computed from. related_gl_rows are rows a good review surfaces that do
    not support the amount: claimed-but-rejected rows, prior-period comparables, recoveries and overlapping
    entries. supporting_docs: for ACCEPT and REVISE items, the documents that support the amount carried
    (documents about removed rows, such as the M-03 expense reports, the Matter 1004 retainer papers and the
    H&C 25-0910 invoice for M-08, are related evidence and are not listed); for REJECT and REQUEST_INFO items,
    the documents that drive the conclusion. Flags that must not fire are recorded in reviewer_note. Amounts are
    EBITDA-signed (+ increases EBITDA). Expected totals: claims 418,000 / 1,004,000 / 1,034,500; management
    finals 16,000 / 335,700 / 244,200; D-1 0 / 18,400 / 0; pending (M-02, M-12) 360,000 / 360,000 / 525,000.
  adjustments:
    - adj_id: M-01
      case_type: RECURRING
      treatment: REVISE
      amounts: {FY2024: 0, FY2025: 84500, TTM Jun-26: 30000}
      supporting: [hc_lit_*]
      related: [hc_retainer_*, hc_adhoc_*]
      supporting_docs: [hc_el_2291, hc_inv_0212, hc_inv_0418, hc_inv_0615, hc_inv_0910, hc_inv_1120, dawson_settlement]
      expected_flags: [RECURRING_PATTERN, CONTINUING_OBLIGATION]
      question_topics:
        - Post-settlement legal fees or continuing obligations under the Dawson settlement
        - Confirmation that the insurer paid the Dawson settlement with no Company funding
        - Defense cost coverage and the $100,000 self-insured retention
        - Nature of the Dawson claim (customer property damage) and any similar claims
        - Post-close status of the Matter 1004 general corporate retainer
      rationale: >-
        Tied H&C 6400 activity to invoices. Matter 2291 (Dawson v. Meridian, a customer property-damage claim from
        a failed water heater) is five invoices totaling $84.5k in FY25, of which $30.0k (25-0910, 25-1120) falls in
