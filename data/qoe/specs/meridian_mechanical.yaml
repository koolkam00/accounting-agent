        - "Warehouse and truck stock were counted on December 30-31, 2025 by two-person teams, with test counts by accounting. Results were reconciled to the perpetual inventory in FieldPro."
        - table:
            columns: [{title: Component}, {title: "Dec 31, 2025", align: right, width: 95}, {title: "Dec 31, 2024", align: right, width: 95}]
            rows:
              - [Obsolete parts and discontinued equipment, "38,400.00", "35,100.00"]
              - ["Shrink (unlocated parts, truck stock variances)", "25,600.00", "23,400.00"]
            total: [Year-end count adjustment, "64,000.00", "58,500.00"]
        - "Consistent with prior years, the year-end count adjustment reflects shrink and obsolete parts. We recorded the adjustment of $64,000.00 to 5400 Inventory Adjustments & Write-offs on December 31, 2025."
