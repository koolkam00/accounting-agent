  - id: hc_el_1004
    filename: 4.1 Hollis Crane Engagement Letter - Matter 1004.pdf
    folder: 04 Legal
    template: letter
    key_phrases: ["$2,500 per month", "continuing until terminated by either party", "Matter 1004 (General Corporate & Employment)"]
    fields:
      issuer: hollis_crane
      date: "March 6, 2023"
      to: [Mr. Richard Castellano, Chief Executive Officer, "Meridian Mechanical Services, LLC", 5801 Palm River Road, "Tampa, FL 33619"]
      re: [Engagement Letter - General Corporate & Employment Counsel, Client-Matter No. 20417-1004]
      salutation: "Dear Rick:"
      body:
        - "Thank you for selecting Hollis & Crane LLP to serve as general corporate and employment counsel to Meridian Mechanical Services, LLC (the \"Company\"). This letter confirms the scope of our engagement and the basis on which we will be compensated."
        - heading: Scope of Services
        - "We will provide routine general corporate and employment advice, including contract review, entity maintenance, wage-and-hour and personnel questions, and attendance at management meetings on request. We have opened this engagement as Matter 1004 (General Corporate & Employment)."
        - heading: Fees
        - "For the services described above, the Company will pay a fixed monthly retainer of $2,500 per month, billed on the first business day of each month and continuing until terminated by either party on thirty (30) days' written notice. Projects outside the retainer scope, such as policy rewrites, restrictive-covenant reviews, transactions or litigation, will be billed separately at our standard hourly rates and, where appropriate, opened as separate matters."
        - "Our current standard hourly rates are $525 for partners, $325 for associates and $175 for paralegals. Rates are reviewed annually."
        - heading: Term
        - "This engagement has no fixed term. It will remain in effect, and the monthly retainer will continue to be billed, until either party terminates it in writing."
        - "If these terms are acceptable, please countersign and return a copy of this letter. We appreciate the opportunity to work with you."
      closing: Very truly yours,
      signatures:
        - {party: HOLLIS & CRANE LLP, name: Evelyn R. Hollis, title: Partner, signed: true}
      countersign:
        heading: "ACKNOWLEDGED AND AGREED:"
        signatures:
          - {party: "MERIDIAN MECHANICAL SERVICES, LLC", name: Richard Castellano, title: Chief Executive Officer, signed: true, date: "March 9, 2023"}

  - id: hc_el_2291
    filename: 4.2 Hollis Crane Engagement Letter - Matter 2291 Dawson.pdf
    folder: 04 Legal
    template: letter
    key_phrases: ["Matter 2291 (Dawson v. Meridian)", "defense of this action through final resolution", "alleging property damage from a water heater failure"]
    fields:
      issuer: hollis_crane
      date: "January 8, 2025"
      to: [Mr. Richard Castellano, Chief Executive Officer, "Meridian Mechanical Services, LLC", 5801 Palm River Road, "Tampa, FL 33619"]
      re: ["Engagement Letter - Dawson v. Meridian Mechanical Services, LLC", Hillsborough County Circuit Court Case No. 24-CA-008815, Client-Matter No. 20417-2291]
      salutation: "Dear Rick:"
      body:
        - "This letter confirms that Hollis & Crane LLP will represent Meridian Mechanical Services, LLC (the \"Company\") in the lawsuit filed by Carla Dawson, a residential customer, alleging property damage from a water heater failure following a 2023 installation by the Company. We have opened this engagement as Matter 2291 (Dawson v. Meridian), separate from our general corporate retainer under Matter 1004."
        - heading: Scope
        - "Our engagement is limited to the defense of this action through final resolution, whether by dismissal, settlement or judgment, including any mediation. It does not include appeals or unrelated employment matters, which remain under Matter 1004."
        - heading: Fees and Billing
        - "Litigation services will be billed monthly at our standard hourly rates ($525 partner, $325 associate, $175 paralegal), plus out-of-pocket costs such as court reporter, filing and mediator fees. No retainer deposit is required."
        - "The Company has tendered the claim to its commercial general liability insurer, Coastal Risk Insurance. Defense costs fall within the Company's $100,000 self-insured retention and are the Company's responsibility; the insurer has agreed to fund any settlement within policy limits."
        - heading: Conclusion of the Engagement
        - "Our representation in Matter 2291 will end when the action is finally resolved. We do not expect further fees after resolution other than for settlement documentation and closing the file."
      closing: Very truly yours,
      signatures:
        - {party: HOLLIS & CRANE LLP, name: Evelyn R. Hollis, title: Partner, signed: true}
      countersign:
        heading: "ACKNOWLEDGED AND AGREED:"
        signatures:
          - {party: "MERIDIAN MECHANICAL SERVICES, LLC", name: Richard Castellano, title: Chief Executive Officer, signed: true, date: "January 10, 2025"}

