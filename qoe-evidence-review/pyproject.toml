[project]
name = "qoe-evidence-review"
version = "0.1.0"
description = "Quality-of-earnings evidence review: verify seller-proposed EBITDA adjustments against the general ledger and source documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "openai>=1.0",
    "streamlit>=1.30",
    "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true
