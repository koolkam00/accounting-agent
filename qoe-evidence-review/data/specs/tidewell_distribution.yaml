# ---------------------------------------------------------------------------
# Data room. doc_id = filename. `supports` lists the planted keys a document
# evidences; invoice totals are checked against those rows.
# ---------------------------------------------------------------------------
documents:
  # --- 01 Financial Information (data-quality context, D-2, D-3) -------------------------
  - id: ns_export_email
    filename: 1.1 NetSuite Admin Email - Aug 2024 GL Export Batch.eml
    folder: 01 Financial Information
    template: email
    key_phrases:
      - "exported with the 16-account flash report saved search"
      - "The August 2024 income statement and trial balance in NetSuite are complete"
    fields:
      from: Derek Olsen <dolsen@tidewelldist.example>
      to: Nadia Pruitt <npruitt@tidewelldist.example>
      cc: Jamal Whitaker <jwhitaker@tidewelldist.example>
      date: Mon, 27 Jul 2026 10:41:12 -0400
      subject: "RE: VDR 1 - GL detail export for the buyer (Project Marlin)"
      body: |
        Nadia,

        I pulled the GL detail for the data room in monthly batches from the "GL Detail - All Accounts" saved search. I just noticed the August 2024 batch was exported with the 16-account flash report saved search instead (the one we use for the weekly flash to Wade), so that month only has the sales, cost of sales, freight, wage, officer, rent and legal accounts. Every other month is the full export.

        The August 2024 income statement and trial balance in NetSuite are complete - the management P&L in the data room ties to them. Nothing is wrong in the books; it is only the export. I can re-run August from the correct search tonight if the buyer wants the replacement file.

        Derek

        Derek Olsen | NetSuite Administrator
        Tidewell Distribution Group, LLC

  - id: mip_topside_email
    filename: 1.2 Controller Email - FY2026 MIP Accrual in Management P&L.eml
    folder: 01 Financial Information
    template: email
    key_phrases:
      - "top-side accrual of $186,000 in 6040 for March 2026"
      - "reversed the top-side in June 2026 when the payout ran through payroll"
    fields:
      from: Jamal Whitaker <jwhitaker@tidewelldist.example>
      to: Nadia Pruitt <npruitt@tidewelldist.example>
      date: Fri, 19 Jun 2026 15:02:40 -0400
      subject: MIP accrual - management P&L vs NetSuite
      attachments: ["FY2026 MIP Bonus Calculation - Approved.pdf"]
      body: |
        Nadia,

        For the record in the Project Marlin data room: we do not accrue the MIP in NetSuite during the year; it is expensed when paid. For the management P&L I booked a top-side accrual of $186,000 in 6040 for March 2026 so the FY2026 income statement carries the bonus in the year it was earned (Plan Year April 1, 2025 - March 31, 2026).

        Wade approved the calculation on April 24 and the $186,000 payout ran on the June 12 payroll, coded to 6040 in NetSuite. I reversed the top-side in June 2026 when the payout ran through payroll, so the management P&L expenses the MIP once, in March 2026. The payout agrees to the approved calculation to the dollar.

        Jamal

