# ---------------------------------------------------------------------------
# Management's monthly P&L (NetSuite income statement layout)
# ---------------------------------------------------------------------------
monthly_pl:
  sheet_name: Income Statement
  title: Income Statement - Monthly Trend
  month_format: date
  basis_line: "Accrual basis | Management P&L incl. top-side entries | SYNTHETIC — generated for QoE Evidence Review testing"
  sections:
    - {role: income, name: Income, types: [Income]}
    - {role: cogs, name: Cost Of Sales, types: [Cost of Goods Sold]}
    - {role: expenses, name: Operating Expense, types: [Expense]}
    - {role: other_income, name: Other Income, types: [Other Income]}
    - {role: other_expenses, name: Other Expense, types: [Other Expense]}

# ---------------------------------------------------------------------------
# Management's adjusted EBITDA schedule. Reported EBITDA comes from management's
# P&L (basis: pl), so the Aug-24 accounts missing from the GL export and the MIP
# top-side flow into it. The total-adjustments row stops short of ref 16.
# ---------------------------------------------------------------------------
schedule:
  sheet_name: Adj. EBITDA
  title_rows:
    - Adjusted EBITDA - Management Presentation (Project Marlin)
    - "USD; fiscal years ended March 31, 2025 and 2026 and trailing twelve months ended June 30, 2026 (unaudited)"
    - SYNTHETIC — generated for QoE Evidence Review testing
  columns: {ref: "#", title: Item, category: Type, description: Management commentary, accounts: GL Accounts, support: Data room ref}
  labels:
    net_income: Net income
    interest: Interest expense, net
    taxes: State income taxes (PTET)
    depreciation_amortization: Depreciation & amortization
    reported_ebitda: EBITDA, as reported
    total_adjustments: Total adjustments
    adjusted_ebitda: Adjusted EBITDA
  basis: pl
  total_excludes: ["16"]
  arithmetic_note: >-
    Management's SUM range for the total row ends at ref 15; ref 16 (sale-process fees, added last) is listed
    but not totaled, so the printed total and adjusted EBITDA are understated by 95,000 in FY2026 and TTM.
  adjustments:
    - ref: "1"
      title: Owner compensation normalization
      category: Normalization
      description: "W. Carrow's salary ($900,000 a year) normalized to the $360,000 total target cash in his executed post-close employment agreement, benchmarked to market by Holloway Compensation Advisors."
      accounts: "6050"
      support: VDR 2.1, 2.2
      amounts: {FY2025: 540000, FY2026: 540000, TTM Jun-26: 540000}
    - ref: "2"
      title: Related-party rent - Savannah DC
      category: Normalization (related party)
