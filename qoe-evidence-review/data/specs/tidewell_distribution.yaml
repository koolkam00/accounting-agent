      reviewer_note: >-
        Pre-registered alternative: REJECT 0 / 0 / 0 (nothing in the GL to add back). If the family office provides
        the services free of charge, a standalone-cost adjustment would reduce EBITDA; that is a buyer diligence
        item, not management's add-back. Must not fire: RECURRING_PATTERN. There is no document to link;
        NO_DOCUMENT_SUPPORT on the claimed set is acceptable as INFO.
      rationale: >-
        Management adds back $60.0k a year (its estimate of $5.0k a month) for accounting, HR and IT support from
        Carrow Family Holdings, the owner's family office. There is no GL activity with Carrow Family Holdings in
        any account and no invoice, agreement or management-fee entry; the schedule cites a management estimate
        only. An add-back needs a cost inside EBITDA. Pending until management shows where the cost is recorded;
        provisional supported amount 0 / 0 / 0. If the family office provides the services without charge, the
        adjustment runs the other way as a standalone cost.

