# ---------------------------------------------------------------------------
# Answer key. Keys and globs resolve to GL source rows. Non-REQUEST_INFO amounts
# are verified against the GL: supporting rows + recoveries - period moves
# - normalized level - restored missing-month activity.
# ---------------------------------------------------------------------------
ground_truth:
  authored_by: QoE Evidence Review build team - dev deal 2 answer key (independent of the engine); see docs/deal_notes/tidewell_distribution_author_notes.md
  notes: >-
    SYNTHETIC. Fiscal years end March 31; FY2026 and TTM Jun-26 overlap in Jul 2025 - Mar 2026. supporting_gl_rows
    are the GL rows behind the diligence amount (for the normalizations, the actual cost the benchmark level is
    netted against); related_gl_rows are rows a good review surfaces that do not support the amount (unclaimed
    same-vendor retainers, duplicate postings, subscription months, recoveries, routine same-account entries).
    supporting_docs support the amount carried; related_docs are context or evidence against the claim. Flags
    that must not fire are recorded in reviewer_note. Amounts are EBITDA-signed. ADEQUATE items: refs 1, 4, 6, 8,
    9, 15, 16 (7 of 16). Expected totals (FY2025 / FY2026 / TTM Jun-26): claims 648,000.00 / 1,488,000.00 /
    1,623,630.18 (management's printed total omits ref 16: 648,000.00 / 1,393,000.00 / 1,528,630.18); management
    finals 480,000.00 / 1,098,600.00 / 1,202,430.18; pending (ref 3) 60,000 in each period; diligence items D-1
    0 / 32,000 / 32,000, D-2 0 / -186,000 / 0, D-3 -363,586.47 / 0 / 0.
  adjustments:
    - adj_id: "1"
      case_type: ADEQUATE
      treatment: ACCEPT
      amounts: {FY2025: 540000, FY2026: 540000, TTM Jun-26: 540000}
      supporting: ["owner_pay_*"]
      normalized_level: {monthly: 30000}
      supporting_docs: [carrow_ea, holloway_benchmark]
      question_topics:
        - Employer payroll tax effect of the salary reduction (Medicare on the $540,000; not claimed)
        - Any other owner compensation, perquisites or family members on payroll outside 6050
        - Confirmation that the executed agreement is the one the buyer will sign at closing, with no side arrangements
      reviewer_note: >-
        Normalization positive control. Must not fire: UNSIGNED_OR_DRAFT_SUPPORT, NORMALIZATION_BENCHMARK_MISSING,
        RECURRING_PATTERN. The agreement is executed and acknowledged by the buyer (effective at closing) and the
        benchmark was commissioned by the buyer from an independent consultant. Unclaimed seller upside: employer
        Medicare 1.45% x 540,000 = 7,830 per period (Social Security is capped below both salaries); not carried
        because management did not claim it.
      rationale: >-
        W. Carrow's salary is $900.0k a year (24 semi-monthly payrolls of $37.5k in 6050) in every period. The
        executed post-close employment agreement (signed 5/18/26 by the Company and the Executive, acknowledged by
        Saltmarsh) sets a $300.0k base and a 20% target bonus, total target cash of $360.0k, with no perquisites.
        Holloway's independent benchmark, engaged by the buyer, puts the peer median at $358.0k of total target cash,
        so $360.0k is a market level. $900.0k less $360.0k is $540.0k per period, as claimed. Accept.

    - adj_id: "2"
      case_type: CONTRADICTED
      treatment: REVISE
      amounts: {FY2025: -60000, FY2026: -60000, TTM Jun-26: -60000}
      supporting: ["pih_rent_*"]
      related: ["prop_tax/*"]
      normalized_level: {monthly: 29000}
      supporting_docs: [pih_lease, bov]
      expected_flags: [CONTRADICTORY_EVIDENCE]
      question_topics:
        - Terms of the post-close lease with Pooler Industrial Holdings (rent, escalations, term)
        - Basis for management's $20,000 a month market rent
        - Landlord costs the Company pays under the NNN lease (property taxes, insurance, roof and structure)
        - Other related-party arrangements with the Carrow family
      reviewer_note: >-
        Normalization whose sign flips. Must not fire: NORMALIZATION_BENCHMARK_MISSING (a signed independent broker
        opinion exists), UNSIGNED_OR_DRAFT_SUPPORT, RECURRING_PATTERN. SIGN_ERROR is not the right code: the GL rows
        are ordinary rent debits and the direction change comes from the benchmark. A post-close lease at $7.25/SF
        with 3% escalations raises run-rate rent further in later years (buyer model).
      rationale: >-
        Tidewell pays $24.0k a month ($288.0k a year; $6.00/SF NNN, flat since 2019) to Pooler Industrial Holdings,
        which the CEO controls. Management adds back $48.0k, saying the rent is above a $20.0k market level, but
        gives no support for that level. The only benchmark in the data room is Marsh Point's signed opinion
        (2/10/26; four 2024-25 Pooler comparables at $6.95-7.60/SF): market rent is $7.25/SF NNN, $348.0k a year,
        and the letter states the contract rent is below market. The Company already pays the property taxes, so
        the NNN basis is like for like. Normalizing to market reduces EBITDA: $288.0k less $348.0k = -$60.0k per
        period. Revised from +$48.0k to -$60.0k.

