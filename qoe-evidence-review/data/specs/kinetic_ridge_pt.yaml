ground_truth:
  authored_by: >-
    Holdout author (D3), written independently of the engine and AI code: package, catalog and answer key per
    docs/SPEC.md §3, §5.6-§5.7, §9 and the D1 review panel's D3 case list
  notes: >-
    SYNTHETIC holdout deal. Amounts are EBITDA-signed (+ increases EBITDA). supporting_gl_rows are the GL rows behind
    the diligence amount; for REQUEST_INFO items they are the GL cost base management's claim is computed from (A-16
    has none). related_gl_rows are rows a good review surfaces that do not support the amount: removed or overlapped
    claimed rows, other-period comparables, unclaimed continuing charges, and recoveries whose removal is part of the
    amount (A-10 gains). supporting_docs: for ACCEPT and REVISE, the documents behind the amount carried; for REJECT and
    REQUEST_INFO, the documents that drive the conclusion. related_docs are context or evidence against (the continuing
    Tate Whitcomb retainer, the monthly Carmel storage bills, the claim-status email). Must-not flags are in
    reviewer_note.
    Totals (FY2024 / FY2025 / TTM May-26): claims 254,446.19 / 599,063.29 / 1,152,048.46; management-item finals
    171,206.19 / 432,961.29 / 543,396.46; diligence item D-1 (supported cut-off top-side) -21,436.80 / 21,436.80 / 0;
    pending REQUEST_INFO (A-4, A-9, A-16) 51,000 / 109,000 / 521,000. gl_ebitda assumes 6750 (type Overhead) maps to
    OPEX under the §3.4 fallback. Planted data-quality issues the generator cannot yet encode in this key (panel
    decision: the generator's data-quality derivation should emit them; see AUTHOR_NOTES.md): UNMAPPED_ACCOUNT on 6750
    (type "Overhead"), PL_ACCOUNT_NOT_IN_GL on 6995, GL_ACCOUNT_NOT_IN_PL on 6305. Buyer run-rate, not a QoE
    adjustment: Stridewise ($2,150/month in 6305 from Apr-2026, two months in TTM) understates annual run-rate cost by
    about $21.5k. The company is an LLC taxed as a partnership; there is no income tax line.
