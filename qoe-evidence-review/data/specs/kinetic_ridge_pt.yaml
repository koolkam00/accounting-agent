  - id: cutoff_email
    filename: 1.1 Whitlock Haas Email - FY2024 Cut-Off (Lakeshore December Invoice).txt
    folder: 01 Financial Reporting
    template: email
    key_phrases:
      - "was entered in Xero on January 8 with the entry date instead of the invoice date"
      - "6995 Year-End Cut-Off Adjustments"
      - "+$21,436.80 in December 2024 and -$21,436.80 in January 2025"
    fields:
      from: Carolyn Haas <chaas@whitlockhaas.example>
      to: Megan Sato <msato@kineticridgept.example>
      cc: Brent Oyelaran <boyelaran@kineticridgept.example>
      date: Mon, 10 Feb 2025 16:42:18 -0500
      subject: FY2024 close - Lakeshore December invoice (cut-off)
      body: |
        Megan,

        While tying out the December AP subledger I found that Lakeshore Revenue Cycle Partners invoice LRC-2412 ($21,436.80, services December 1-31, 2024, invoice dated December 31, 2024) was entered in Xero on January 8 with the entry date instead of the invoice date, so the ledger shows it in January 2025.

        FY2024 is locked in Xero because we filed the partnership extension off the locked numbers, so we are not re-dating the bill. Instead the management reporting pack carries it in December through line 6995 Year-End Cut-Off Adjustments: +$21,436.80 in December 2024 and -$21,436.80 in January 2025. The Xero general ledger will keep showing the bill in January 2025.

        I checked every January 2025 bill over $2,500 against its invoice date and found no other December invoices posted to January.

        Carolyn

        Carolyn Haas, CPA
        Whitlock Haas CPAs, LLP

