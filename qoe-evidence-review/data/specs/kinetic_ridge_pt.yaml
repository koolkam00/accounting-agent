    - adj_id: D-1
      case_type: SUPPORTED_TOPSIDE
      treatment: REVISE
      amounts: {FY2024: -21436.80, FY2025: 21436.80, TTM May-26: 0}
      supporting: [lrc_dec24]
      period_moves:
        - {keys: [lrc_dec24], service_start: "2024-12", service_end: "2024-12"}
      supporting_docs: [lrc_invoice_2412, cutoff_email]
      question_topics:
        - Other December 2024 invoices posted in January 2025, and December 2025 invoices posted in January 2026 (cut-off search)
        - Consistent one-month lag on utilities, merchant fees and outsourced close fees (December costs booked in January each year; net annual effect immaterial); confirm the accrual convention
      rationale: >-
        Cut-off misposting across the FY24/FY25 year-end: Lakeshore invoice LRC-2412 (services December 1-31, 2024,
        dated 12/31/24) was entered in Xero on 1/8/25, so the GL has two Lakeshore invoices in January 2025 and none in
        December 2024. Management's reporting pack corrects it through 6995 Year-End Cut-Off Adjustments (+$21,436.80
        Dec-24, -$21,436.80 Jan-25), an account with no Xero activity; the invoice and the outside accountant's email
        support the correction. dil_recon reverses the pack to the GL, so the supported top-side is carried as a
        diligence item: FY24 -$21,436.80, FY25 +$21,436.80, TTM 0 (January 2025 is before the TTM).
      ambiguity: low
      reviewer_note: >-
        Supported management top-side, per SPEC §5.7. With dil_recon at +21,436.80 / -21,436.80 / 0, GL EBITDA plus
        dil_recon plus D-1 equals management's reported EBITDA. The EBITDA-neutral 6305-to-6300 mapping top-side is
        not a diligence item.
