# ---------------------------------------------------------------------------
# Management's monthly P&L: management reporting pack in Xero's section names.
# ---------------------------------------------------------------------------
monthly_pl:
  sheet_name: Profit and Loss
  title: Profit and Loss
  month_format: date
  basis_line: Management reporting pack - accrual basis
  sections:
    - {role: income, name: Trading Income, types: [REVENUE]}
    - {role: cogs, name: Cost of Sales, types: [DIRECTCOSTS]}
    - {role: expenses, name: Operating Expenses, types: [EXPENSE, OVERHEADS, Overhead, DEPRECIATN]}
    - {role: other_income, name: Other Income, types: [OTHERINCOME]}
    - {role: other_expenses, name: Other Expenses, types: []}

# ---------------------------------------------------------------------------
# Management's adjusted EBITDA schedule (SPEC §3.6). Reported EBITDA is built
# from management's P&L (basis: pl), so the Dec-24 / Jan-25 cut-off entry flows
# into management's reported EBITDA.
# ---------------------------------------------------------------------------
schedule:
  sheet_name: Adj EBITDA
  title_rows:
    - Adjusted EBITDA - management presentation (Project Sycamore)
