        - Comparability of the broker's absolute-net market rent with the existing lease basis (tenant pays taxes, insurance and maintenance)
        - Post-close lease term and the 2.5% escalator from the first anniversary of closing in the buyer's run-rate
      rationale: >-
        Tied 6100 to 29 monthly Kowalczyk Family Realty bills of $32.0k for 1850 Oak Ridge Pkwy ($384.0k a year;
        Reference KFR-Z and the memo identify Zionsville, separate from the $6.0k Noblesville rent paid to the same
        landlord). The executed 2021 lease fixes rent at $32.0k a month, absolute net, no escalation. Northfield's
        opinion of market rent (no interest in the property, fee not contingent) concludes $19.60/RSF absolute net on
        15,000 RSF, i.e. $294.0k a year ($24.5k a month), and the landlord has signed an amendment resetting rent to
        $24.5k at closing. Normalization = $384.0k - $294.0k = $90.0k in each period. The Company pays the
        building's real estate taxes directly (6800, May/Nov installments), consistent with the absolute-net lease
        and benchmark, so the rents compare like for like. Executed lease plus an independent benchmark: accept.
      ambiguity: low
      reviewer_note: >-
        Normalization positive control (D1 made every normalization REQUEST_INFO). Must not fire:
        NORMALIZATION_BENCHMARK_MISSING, UNSIGNED_OR_DRAFT_SUPPORT, RECURRING_PATTERN (recurrence is the premise),
        OVERLAP_WITH_OTHER_ADJUSTMENT (the KFR-N Noblesville rows belong to A-2). Normalized to year-1 market cash
        rent per the Northfield opinion (standard QoE practice). The amendment extends the term 10 years from
        closing with 2.5% escalators; straight-line expense would be about $329.4k a year (normalization about
        $54.6k on that basis). That is a buyer GAAP run-rate consideration, not pre-registered. The benchmark is a
        seller-commissioned SIOR broker opinion (no interest in the property, fee not contingent), which the D1 case
        list accepts for this control.
